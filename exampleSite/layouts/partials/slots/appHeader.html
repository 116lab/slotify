<!--
  exampleSite OVERRIDE of slots/appHeader.html  (Slotify.slots.appHeader)

  DEMO of site-level theme-switcher control with NO theme fork. This site:
    1. added a 'brand' personality via [params.palette.brand] in hugo.toml
       (colors live in the palette, which defines which personalities exist);
    2. names + icons every personality HERE, in the slot's i18n block, including
       the new 'brand' one — in BOTH locales, so names follow the language switch.

  Overriding this partial replaces the theme's default block entirely, so the
  block below restates the six built-ins (you own the full list once you override)
  and appends 'brand'. An id present in the palette but absent here would degrade
  to a capitalized name + mdi-palette; an entry here for an id not in the palette
  is ignored. The <app-header>/<app-drawer> mount is copied verbatim from the
  theme default to keep the chrome working — customize freely from here.

  Receives `ctx`: { siteConfig, route, t, currentPersonality, isDark, personalities,
  currentLocale, drawer, setPersonality, setDark, setLocale, toggleDrawer,
  setDrawer }.
-->
<script type="application/json" data-slotify-i18n="Slotify.slots.appHeader">
{
  "en": {
    "styles": {
      "vibrant":  { "name": "Vibrant",  "icon": "mdi-palette" },
      "sunset":   { "name": "Sunset",   "icon": "mdi-weather-sunset" },
      "forest":   { "name": "Forest",   "icon": "mdi-tree" },
      "ocean":    { "name": "Ocean",    "icon": "mdi-waves" },
      "nordic":   { "name": "Nordic",   "icon": "mdi-snowflake" },
      "espresso": { "name": "Espresso", "icon": "mdi-coffee" },
      "brand":    { "name": "Brand",    "icon": "mdi-star-four-points" }
    }
  },
  "zh": {
    "styles": {
      "vibrant":  { "name": "繽紛",   "icon": "mdi-palette" },
      "sunset":   { "name": "日落",   "icon": "mdi-weather-sunset" },
      "forest":   { "name": "森林",   "icon": "mdi-tree" },
      "ocean":    { "name": "海洋",   "icon": "mdi-waves" },
      "nordic":   { "name": "北歐",   "icon": "mdi-snowflake" },
      "espresso": { "name": "濃縮",   "icon": "mdi-coffee" },
      "brand":    { "name": "品牌",   "icon": "mdi-star-four-points" }
    }
  }
}
</script>
<script type="text/x-template" id="slot-appHeader-template">
  <app-header
    :site-config="ctx.siteConfig"
    :current-personality="ctx.currentPersonality"
    :is-dark="ctx.isDark"
    :personalities="ctx.personalities"
    :current-locale="ctx.currentLocale"
    @update:current-personality="ctx.setPersonality"
    @update:is-dark="ctx.setDark"
    @set-locale="ctx.setLocale"
    @toggle-drawer="ctx.toggleDrawer"
  ></app-header>

  <app-drawer
    :model-value="ctx.drawer"
    :personalities="ctx.personalities"
    :current-personality="ctx.currentPersonality"
    @update:model-value="ctx.setDrawer"
    @update:current-personality="ctx.setPersonality"
  ></app-drawer>
</script>
