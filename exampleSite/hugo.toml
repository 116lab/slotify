baseURL = 'https://example.org/'
languageCode = 'en-US'
title = 'My New Hugo Project'
theme = 'slotify'
enableRobotsTXT = true

[outputs]
  taxonomy = ['HTML', 'JSON']
  term     = ['HTML', 'JSON']
  home     = ['HTML', 'JSON', 'SEARCHINDEX']
  page     = ['HTML', 'JSON']
  section  = ['HTML', 'JSON']

[taxonomies]
  tag = 'tags'
  series = 'series'

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 20

  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 30

  [[menus.main]]
    name = 'Search'
    pageRef = '/search'
    weight = 40

[params]
  author = "Slotify Creator"
  description = "A premium SPA theme for technical bloggers"

  # Param reference (values + defaults) is the "Theme Parameters" table in the
  # README. The demo deviates from the theme defaults to showcase: pagerSize 5
  # (theme default 10), and paginationMode "static" (theme default "client") to
  # exercise real /page/N/ pager pages. The Playwright suite pins each server's
  # mode via HUGO_PARAMS_PAGINATIONMODE, so both modes stay covered regardless.
  pagerSize = 5
  paginationMode = "static"

  # DEMO: declare this site's languages from the SITE, without forking the theme.
  # [[params.locales]] REPLACES the theme's default list (data/locales.json) — arrays
  # don't deep-merge. The FIRST entry is the default/fallback; the persisted choice
  # is the `code`, so order only sets the switcher's cycle order. This demo keeps
  # en + zh (matching the strings the theme's own slots ship). To ADD a language,
  # append an entry here, drop a translated static/js/i18n/<code>.json, and (if you
  # rely on theme slot text) translate the slots you override — then self-check with
  # check-i18n-parity.py. We leave that to the consuming site so the demo stays
  # fully translated rather than half.
  [[params.locales]]
    code = "en"
    label = "EN"
  [[params.locales]]
    code = "zh"
    label = "繁"

  # DEMO: add a brand-new theme personality from the SITE, without forking the
  # theme. [params.palette] deep-merges onto the theme's data/theme-palette.json,
  # so this 'brand' personality is ADDED to the switcher alongside the built-in
  # six. Roles are background/surface/primary/secondary per light/dark; mesh
  # tokens are derived. Its display name + icon are supplied by the site's
  # appHeader slot override (layouts/partials/slots/appHeader.html). Colors here
  # were self-checked with `python3 .agent/scripts/check-palette-a11y.py` (WCAG AA
  # + CIEDE2000) — the theme's own guard can't see a site palette, so you own it.
  [params.palette.brand.light]
    background = "#F5F7FF"
    surface    = "#FFFFFF"
    primary    = "#4338CA"
    secondary  = "#0E7490"
  [params.palette.brand.dark]
    background = "#0B1020"
    surface    = "#161C2E"
    primary    = "#818CF8"
    secondary  = "#22D3EE"

  # Easily inject custom CSS styles without editing HTML templates
  # Note: Place your custom file in `exampleSite/static/css/`
  # customCSS = ["/css/my-custom-style.css"]

  [params.social]
    github = "https://github.com/116lab/slotify"
    twitter = "https://twitter.com"
    linkedin = "https://linkedin.com"
    facebook = "https://facebook.com"
    instagram = "https://instagram.com"
  [params.features]
    mermaid = true
    math    = true

  # DEMO: Giscus comments (GitHub Discussions) rendered by the site's
  # postView/bottom slot override (layouts/partials/slots/postView/bottom.html),
  # which is the README §8 Giscus reference. Values come from giscus.app for
  # the 116lab/slotify repo; replace them with your own repo's.
  [params.giscus]
    repo        = "116lab/slotify"
    repoId      = "R_kgDOVQw7jQ"
    category    = "General"
    categoryId  = "DIC_kwDOVQw7jc4DJJ_d"
    mapping     = "pathname"

# Markup Renderer Override (Opt-in)
# The Slotify theme defaults to Hugo's safe renderer (unsafe = false).
# Enable the setting below only if your Markdown content contains raw HTML.
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
