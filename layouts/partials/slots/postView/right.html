<!--
  slots/postView/right.html  (Slotify.slots.postView.right)
  Right rail of a post (ContentShell #aside). Default: the Table of Contents.
  Self-contained: UI strings (i18n block), markup (x-template) AND styles
  (<style> below — the ToC-specific rules; the shared sidebar-panel base stays
  in slotify.css). Override in your own site to replace the right rail entirely.
  Receives `ctx`: { pageData, error, siteConfig, route, t }.
-->
<style>
/* Table of Contents — active-position left border + h3 indent (Slotify.slots.postView.right). */
.toc-link {
    display: block;
    border-left: 2px solid transparent;
}
.toc-link:hover {
    color: rgb(var(--v-theme-primary));
}
.toc-link.toc-active {
    color: rgb(var(--v-theme-primary));
    font-weight: 700;
    border-left-color: rgb(var(--v-theme-primary));
    background: rgba(var(--v-theme-primary), 0.05);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
.toc-depth-h3 {
    margin-left: 12px;
}
</style>
<script type="application/json" data-slotify-i18n="Slotify.slots.postView.right">
{
  "en": { "title": "Table of Contents", "expand": "Expand table of contents", "collapse": "Collapse table of contents" },
  "zh": { "title": "目錄", "expand": "展開目錄", "collapse": "收合目錄" }
}
</script>
<script type="text/x-template" id="slot-postView-right-template">
  <table-of-contents
    v-if="ctx.pageData && ctx.pageData.content"
    :content="ctx.pageData.content"
    container-id="hugo-content"
    :title="ctx.t('title')"
    :expand-label="ctx.t('expand')"
    :collapse-label="ctx.t('collapse')"
  ></table-of-contents>
</script>
