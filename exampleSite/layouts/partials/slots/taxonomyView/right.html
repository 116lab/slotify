<!--
  exampleSite override: slots/taxonomyView/right.html — a right-rail demo for the
  shared Tags/Series view. Its point of difference from the homeView/right demo:
  one view backs both taxonomies, so the override branches on ctx.taxonomy
  ('tag' | 'series') to render the right copy per page — the new capability these
  slots add. Reads ctx.pageData.title (the live term/index title) + the slot's own
  namespaced i18n (ctx.t). Pure HTML/CSS — no framework internals.

  Plain <div>, not <aside>: the complementary landmark is reserved for the
  labelled sidebar widgets (ToC / Series Navigator); a bare, unlabelled <aside>
  here would only add landmark noise.
-->
<script type="application/json" data-slotify-i18n="Slotify.slots.taxonomyView.right">
{ "en": { "tag": "Tags", "series": "Series",
          "tagHint": "Browse posts by topic — pick a tag to filter.",
          "seriesHint": "Multi-part guides, read in order." },
  "zh": { "tag": "標籤", "series": "系列",
          "tagHint": "依主題瀏覽文章 — 點一個標籤來篩選。",
          "seriesHint": "多篇連載指南，依序閱讀。" } }
</script>
<script type="text/x-template" id="slot-taxonomyView-right-template">
  <div class="glass-panel pa-5" style="border-radius: var(--radius-lg);">
    <h2 class="text-subtitle-1 font-weight-bold mb-2">
      {{ "{{" }} ctx.taxonomy === 'series' ? ctx.t('series') : ctx.t('tag') {{ "}}" }}
    </h2>
    <p class="text-body-2 mb-0" style="opacity: 0.8;">
      {{ "{{" }} ctx.taxonomy === 'series' ? ctx.t('seriesHint') : ctx.t('tagHint') {{ "}}" }}
    </p>
  </div>
</script>
