<!--
  exampleSite override: slots/homeView/right.html — a right-rail (directional)
  slot demo, the one slot kind the other demos don't cover. ContentShell always
  reserves the left/right rail gutter on large screens (hidden below lg), so this
  override simply fills the right rail; an empty rail renders as whitespace in the
  same reserved space. Reads ctx.siteConfig + the slot's own namespaced i18n
  (ctx.t). Pure HTML/CSS — no framework internals.

  Plain <div>, not <aside>: the complementary landmark is reserved for the
  labelled sidebar widgets (Table of Contents / Series Navigator). A bare,
  unlabelled <aside> here would only add landmark noise.
-->
<script type="application/json" data-slotify-i18n="Slotify.slots.homeView.right">
{ "en": { "title": "About this demo", "browse": "Browse tags & series from the menu." },
  "zh": { "title": "關於這個範例", "browse": "從選單瀏覽標籤與系列。" } }
</script>
<script type="text/x-template" id="slot-homeView-right-template">
  <div class="glass-panel pa-5" style="border-radius: var(--radius-lg);">
    <h2 class="text-subtitle-1 font-weight-bold mb-2">{{ "{{" }} ctx.t('title') {{ "}}" }}</h2>
    <p class="text-body-2 mb-3" style="opacity: 0.8;">{{ "{{" }} ctx.siteConfig.description {{ "}}" }}</p>
    <p class="text-caption mb-0" style="opacity: 0.65;">{{ "{{" }} ctx.t('browse') {{ "}}" }}</p>
  </div>
</script>
