<!--
  exampleSite override: slots/head.html — raw <head> injection (the documented
  home for analytics / meta / fonts). It is not a Vue region slot, so it gets no
  per-slot ctx — but it runs at <head> parse time and can listen to the global
  `slotify:*` window events. That is how a persistent, non-remounting widget
  (e.g. analytics) reacts to the SPA — contrasting with per-route slots (e.g. a
  comments widget in postView/bottom), which re-init on their own `slotify:slot`
  mount.

  Demo only: a no-op console "pageview" logger that exercises slotify:ready /
  slotify:route / slotify:locale. Open DevTools → Console to watch it; swap in
  your real analytics. No framework internals.
-->
<script>
  (() => {
    const log = (...a) => console.info('[slotify demo analytics]', ...a);

    // slotify:ready fires once when the SPA is interactive. This <head> script
    // runs before the app mounts, so the flag isn't set yet → we wait for the
    // event; the idempotent window.__SLOTIFY_READY__ covers a late-loaded script.
    const onReady = () => {
      log('ready — initialise persistent widget once');
      log('pageview', location.pathname); // first view (this load is a real HTML doc)
    };
    if (window.__SLOTIFY_READY__) onReady();
    else window.addEventListener('slotify:ready', onReady, { once: true });

    // slotify:route — SPA navigation has no page reload, so a global widget that
    // never remounts counts pageviews here (per-route slots use slotify:slot).
    window.addEventListener('slotify:route', (event) => log('pageview', event.detail.path));

    // slotify:locale — UI-language change (no route change, no content refetch).
    window.addEventListener('slotify:locale', (event) => log('locale ->', event.detail.locale));
  })();
</script>
